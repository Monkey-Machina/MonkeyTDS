name: Deploy frontend to Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "MTDS Materials/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh material data
        run: |
          python scripts/compile_materials.py --out frontend/data/materials.json
          { printf 'window.__MTDS_DATA__ = '; cat frontend/data/materials.json; printf ';\n'; } > frontend/data/materials.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deploy
        uses: actions/deploy-pages@v4
